databases:
  - name: hope-portal-db
    databaseName: hope_portal
    user: hope_user
    plan: free

services:
  - type: web
    name: hope-portal-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hope-portal-db
          property: connectionString
      - key: SECRET_KEY
        value: hopesecretkey2024changethisinproduction
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "["https://hope-portal-frontend.onrender.com"]"

  - type: web
    name: hope-portal-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
