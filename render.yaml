services:
  # PostgreSQL Database
  - type: pserv
    name: hope-portal-db
    plan: free
    region: oregon

  # Backend API (FastAPI)
  - type: web
    name: hope-portal-backend
    env: python
    region: oregon
    plan: free
    branch: feature/certificate-system
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hope-portal-db
          property: connectionString
      - key: SECRET_KEY
        value: hopesecretkey2024changethisinproduction
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://hope-portal-frontend.onrender.com"]'

  # Frontend (React/Vite Static Site)
  - type: web
    name: hope-portal-frontend
    env: static
    region: oregon
    plan: free
    branch: feature/certificate-system
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://hope-portal-backend.onrender.com
